<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">

  <!-- captions -->

    <text class="serif" x="114" y="108" font-size="36">An AI client connects</text>
    <text class="sans muted" x="114" y="148" font-size="19">It finds your OAuth server and starts a sign-in with PKCE.</text></g>
  <g id="g2"><circle cx="80" cy="96" r="20" fill="#0f8f78"/><text class="sans b white" x="80" y="104" font-size="22" text-anchor="middle">2</text>

  <g id="g5"><circle cx="80" cy="96" r="20" fill="#0f8f78"/><text class="sans b white" x="80" y="104" font-size="22" text-anchor="middle">5</text>

    <polyline points="666,525 723,525 723,500 780,500"/>

  </g>

  <rect x="414" y="325" width="252" height="110" rx="14" fill="#fffdf8" stroke="#12241f" stroke-width="2"/>
  <rect id="hOauth" x="414" y="325" width="252" height="110" rx="14" fill="none" stroke="#0f8f78" stroke-width="5" opacity="0"/>
  <text class="sans b" x="430" y="352" font-size="18">OAuth 2.1 server</text>
  <text class="mono muted" x="430" y="374" font-size="12">/authorize · /token</text>
  <text class="mono muted" x="430" y="392" font-size="12">DCR · CIMD · PKCE</text>

  <text class="sans b" x="430" y="497" font-size="18">MCP endpoint</text>
  <text class="mono muted" x="430" y="519" font-size="12">/mcp · your tools</text>
  <text class="mono muted" x="430" y="537" font-size="12">Bearer token → userId</text>
  <text id="mcpStatus" class="sans b teal" x="430" y="565" font-size="13"></text>

  <!-- your login -->
  <rect x="780" y="245" width="330" height="110" rx="14" fill="#fffdf8" stroke="#12241f" stroke-width="2"/>
  <rect id="hLogin" x="780" y="245" width="330" height="110" rx="14" fill="none" stroke="#0f8f78" stroke-width="5" opacity="0"/>
  <text class="sans b" x="800" y="278" font-size="18">Your login &amp; session</text>
  <text class="mono muted" x="800" y="300" font-size="13">resolveUser · loginUrl</text>
  <g id="aliceChip" opacity="0"><rect x="800" y="314" width="200" height="30" rx="15" fill="#e3f7ef" stroke="#0f8f78" stroke-width="1.5"/>
    <text class="sans b teal" x="816" y="334" font-size="14">✓ Alice signed in</text></g>

  <!-- your data -->
  <rect x="780" y="395" width="330" height="210" rx="14" fill="#fffdf8" stroke="#12241f" stroke-width="2"/>
  <rect id="hData" x="780" y="395" width="330" height="210" rx="14" fill="none" stroke="#0f8f78" stroke-width="5" opacity="0"/>
  <text class="sans b" x="800" y="428" font-size="18">Your tools &amp; data</text>
  <text class="mono muted" x="800" y="450" font-size="13">handler({ userId })</text>
  <g id="row0"><rect id="row0r" x="800" y="466" width="290" height="32" rx="8" fill="#fffdf8" stroke="#c9d1cc" stroke-width="1.5"/>
    <text class="sans" x="814" y="487" font-size="15">Customer portal</text><text class="mono muted" x="1076" y="487" font-size="12" text-anchor="end">alice</text></g>
  <g id="row1"><rect id="row1r" x="800" y="506" width="290" height="32" rx="8" fill="#fffdf8" stroke="#c9d1cc" stroke-width="1.5"/>
    <text class="sans" x="814" y="527" font-size="15">Billing migration</text><text class="mono muted" x="1076" y="527" font-size="12" text-anchor="end">alice</text></g>
  <g id="row2"><rect x="800" y="546" width="290" height="32" rx="8" fill="#fffdf8" stroke="#c9d1cc" stroke-width="1.5"/>
    <text class="sans" x="814" y="567" font-size="15">Pricing page</text><text id="bobTag" class="mono muted" x="1076" y="567" font-size="12" text-anchor="end">bob</text></g>

  <!-- left column -->
  <g id="consent" opacity="0"><rect id="consentBox" x="60" y="200" width="230" height="130" rx="16" fill="#fffdf8" stroke="#12241f" stroke-width="2"/>
    <rect id="hConsent" x="60" y="200" width="230" height="130" rx="16" fill="none" stroke="#0f8f78" stroke-width="5" opacity="0"/>
    <text class="mono muted" x="78" y="224" font-size="11" letter-spacing="1">ALICE'S BROWSER</text>
    <text class="sans b" x="78" y="250" font-size="16">Allow this AI client</text>
    <text class="sans b" x="78" y="271" font-size="16">to access your projects?</text>
    <rect x="78" y="288" width="76" height="30" rx="8" fill="none" stroke="#c9d1cc" stroke-width="1.5"/>
    <text class="sans muted" x="116" y="308" font-size="14" text-anchor="middle">Deny</text>
    <rect id="allowBtn" x="166" y="288" width="108" height="30" rx="8" fill="#fffdf8" stroke="#12241f" stroke-width="1.5"/>
    <text id="allowTxt" class="sans b" x="220" y="308" font-size="14" text-anchor="middle">Allow</text></g>

  <rect x="60" y="370" width="230" height="110" rx="18" fill="#fffdf8" stroke="#12241f" stroke-width="2"/>
  <rect id="hClient" x="60" y="370" width="230" height="110" rx="18" fill="none" stroke="#0f8f78" stroke-width="5" opacity="0"/>
  <text class="sans b" x="84" y="408" font-size="24">AI client</text>
  <text class="sans muted" x="84" y="434" font-size="15">Claude, ChatGPT,</text>
  <text class="sans muted" x="84" y="454" font-size="15">any MCP client</text>

  <g id="token" opacity="0"><rect x="60" y="492" width="230" height="34" rx="17" fill="#12241f"/>
    <text class="mono white" x="78" y="514" font-size="13">token · user: alice</text></g>
  <g id="result" opacity="0"><rect x="60" y="540" width="230" height="78" rx="14" fill="#fffdf8" stroke="#0f8f78" stroke-width="2"/>
    <text class="mono muted" x="78" y="562" font-size="11" letter-spacing="1">RESULT FOR ALICE</text>
    <text class="sans b" x="78" y="584" font-size="15">Customer portal</text>
    <text class="sans b" x="78" y="604" font-size="15">Billing migration</text></g>

  <circle id="pk" r="9" fill="#0f8f78" stroke="#fffdf8" stroke-width="3" opacity="0"/>

  <text class="sans muted" x="60" y="658" font-size="13">Illustrated flow, not a recording of a live client.</text>
  <text class="sans muted" x="1140" y="658" font-size="13" text-anchor="end">mcp-trellis · MIT</text>
</svg>
<script>
const TEAL = "#0f8f78", INK = "#12241f", CARD = "#fffdf8", MINT = "#e3f7ef", LINE = "#c9d1cc";
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const win = (t, a, b, f = 0.3) => seg(t, a, a + f) * (1 - seg(t, b - f, b));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, u) => { const A = hex(a), B = hex(b); return `#${A.map((v, i) => Math.round(v + (B[i] - v) * u).toString(16).padStart(2, "0")).join("")}`; };
const set = (id, k, v) => $(id).setAttribute(k, v);
const rise = (id, u) => { set(id, "opacity", u); set(id, "transform", `translate(0 ${(1 - u) * 14})`); };

const P = {
  co: [[290, 410], [370, 410], [370, 380], [414, 380]],
  cm: [[290, 450], [370, 450], [370, 525], [414, 525]],
  ol: [[666, 380], [723, 380], [723, 300], [780, 300]],
  md: [[666, 525], [723, 525], [723, 500], [780, 500]],
  ok: [[414, 345], [382, 345], [382, 265], [290, 265]],
};
const rev = (p) => p.slice().reverse();
const EVENTS = [
  { p: P.co, a: 0.9, b: 2.4, c: TEAL },
  { p: P.ol, a: 3.9, b: 4.9, c: TEAL },
  { p: rev(P.ol), a: 5.5, b: 6.3, c: TEAL },
  { p: P.ok, a: 6.8, b: 7.7, c: TEAL },
  { p: rev(P.ok), a: 8.7, b: 9.4, c: TEAL },
  { p: rev(P.co), a: 9.8, b: 11.0, c: INK },
  { p: P.cm.concat(P.md), a: 12.2, b: 14.3, c: TEAL },
  { p: rev(P.md).concat(rev(P.cm)), a: 14.9, b: 16.2, c: TEAL },
];
function pointAt(pts, u) {
  const lens = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  let d = u * lens.reduce((s, v) => s + v, 0);
  for (let i = 0; i < lens.length; i++) {
    if (d <= lens[i]) { const k = d / lens[i]; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k]; }
    d -= lens[i];
  }
  return pts[pts.length - 1];
}
const CAPS = [[-1, 3.5], [3.5, 6.5], [6.5, 9.5], [9.5, 12], [12, 16.5], [16.5, 999]];
const status = (id, t, items) => {
  const hit = items.find(([a, b]) => t >= a && t < b);
  $(id).textContent = hit ? hit[2] : "";
};

function render(t) {
  CAPS.forEach(([a, b], i) => {
    set(`g${i + 1}`, "opacity", seg(t, a, a + 0.35) * (1 - seg(t, b - 0.25, b)));
  });

  set("hClient", "opacity", Math.max(win(t, 0.5, 3.5), win(t, 9.8, 12.0), win(t, 12.0, 16.4)));
  set("hOauth", "opacity", win(t, 0.8, 12.0, 0.4));
  set("hLogin", "opacity", win(t, 3.8, 6.4));
  set("hConsent", "opacity", win(t, 6.8, 9.4));
  set("hMcp", "opacity", win(t, 12.2, 16.4));
  set("hData", "opacity", win(t, 13.6, 16.4));

  status("oauthStatus", t, [[0.9, 3.5, "discovery + PKCE challenge"], [3.9, 6.5, "calling your resolveUser"], [6.8, 9.5, "asking Alice to consent"], [9.8, 12, "minting a token for alice"]]);
  status("mcpStatus", t, [[12.2, 13.4, "checking the token…"], [13.4, 16.5, "token ✓  userId = alice"]]);

  set("aliceChip", "opacity", seg(t, 4.9, 5.3));
  rise("consent", seg(t, 7.0, 7.5));
  set("wOk", "opacity", seg(t, 6.6, 7.0));
  const u = seg(t, 8.4, 8.7);
  set("allowBtn", "fill", mix(CARD, TEAL, u));
  set("allowBtn", "stroke", mix(INK, TEAL, u));
  set("allowTxt", "fill", mix(INK, CARD, u));
  $("allowTxt").textContent = u > 0.5 ? "Allowed ✓" : "Allow";
  rise("token", seg(t, 11.0, 11.4));

  const r = seg(t, 14.4, 14.9);
  ["row0r", "row1r"].forEach((id) => { set(id, "fill", mix(CARD, MINT, r)); set(id, "stroke", mix(LINE, TEAL, r)); });
  set("row2", "opacity", 1 - 0.55 * r);
  $("bobTag").textContent = r > 0.5 ? "filtered out" : "bob";
  rise("result", seg(t, 15.9, 16.3));

  const ev = EVENTS.find((e) => t >= e.a && t <= e.b);
  if (ev) {
    const [x, y] = pointAt(ev.p, seg(t, ev.a, ev.b));
    set("pk", "cx", x); set("pk", "cy", y); set("pk", "fill", ev.c); set("pk", "opacity", win(t, ev.a, ev.b, 0.12));
  } else set("pk", "opacity", 0);
}
window.render = render;
render(0);
</script>
