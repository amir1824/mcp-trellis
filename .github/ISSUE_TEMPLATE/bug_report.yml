name: Bug report
description: Something in mcp-trellis isn't working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Suspected **security vulnerability**? Please use [Report a vulnerability](https://github.com/amir1824/mcp-trellis/security/advisories/new) instead — see [SECURITY.md](../../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: mcp-trellis version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened, and how to reproduce it
      description: A minimal reproduction (code snippet or request/response) is far more useful than a description alone.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
