name: Release

on:
  push:
    tags:
      - "v*"
  # Actions → Release → Run workflow (only people with write access)
  workflow_dispatch:

# Top-level + job-level: npm OIDC needs id-token on the job that publishes.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Trusted publisher on npmjs.com (package Settings → Trusted Publisher):
    #   Organization or user: amir1824
    #   Repository:          mcp-trellis
    #   Workflow filename:   publish.yml   ← filename only, not "Release"
    #   Environment name:    (leave blank)
    #   Allowed actions:     npm publish
    # npm does NOT validate that form on save — mismatches only show at publish.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (Node 24 may still ship older).
      - run: npm install -g npm@latest

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "${{ steps.ver.outputs.version }}" = "$pkg"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

      - name: Prove OIDC is available to this job
        run: |
          node -v
          npm -v
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty — id-token: write did not take effect"
            exit 1
          }
          echo "OIDC request URL is set (token not printed)"

      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # An empty token makes npm skip OIDC and fail with ENEEDAUTH/404. Strip it
      # so trusted publishing can exchange the GitHub OIDC token.
      - name: Publish to npm
        run: |
          npm config delete "//registry.npmjs.org/:_authToken" || true
          # Prefer project .npmrc if setup-node wrote one into the workspace.
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d' .npmrc
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "$tag" --generate-notes --verify-tag
          else
            gh release create "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
