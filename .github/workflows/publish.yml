name: Release

on:
  # Manual only — Actions → Release → Run workflow
  workflow_dispatch:

# Top-level + job-level: npm OIDC needs id-token on the job that publishes.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Trusted publisher on npmjs.com (package Settings → Trusted Publisher):
    #   Organization or user: amir1824   ← GitHub login, NOT npm "amir-b"
    #   Repository:          mcp-trellis
    #   Workflow filename:   publish.yml   ← filename only, not "Release"
    #   Environment name:    (leave blank)
    #   Allowed actions:     npm publish
    # npm does NOT validate that form on save — mismatches only show at publish.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Do NOT set registry-url: setup-node then writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into NPM_CONFIG_USERCONFIG.
      # An empty/missing token makes npm skip OIDC → ENEEDAUTH.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1 (Node 24 may still ship older).
      - run: npm install -g npm@11.6.2

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "${{ steps.ver.outputs.version }}" = "$pkg"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

      - name: Prove OIDC is available to this job
        run: |
          node -v
          npm -v
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty — id-token: write did not take effect"
            exit 1
          }
          echo "OIDC request URL is set (token not printed)"

      - name: Publish to npm
        run: |
          # Scrub any leftover classic-auth lines that short-circuit OIDC.
          for f in "${NPM_CONFIG_USERCONFIG:-}" "${HOME}/.npmrc" .npmrc; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            sed -i '/_authToken/d' "$f"
          done
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm config delete "//registry.npmjs.org/:_authToken" || true
          npm publish --access public --provenance

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "$tag" --generate-notes --verify-tag
          else
            gh release create "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
