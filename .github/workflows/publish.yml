name: Release

on:
  push:
    tags:
      - "v*"
  # Actions → Release → Run workflow (only people with write access)
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  id-token: write # npm trusted publishing (OIDC) — no long-lived NPM_TOKEN

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate: Settings → Environments → npm-publish → Required reviewers = you
    # Manual prerequisite: configure a trusted publisher on npmjs.com for
    # amir1824/mcp-trellis + this workflow filename before merging, or the
    # publish step below fails with ENEEDAUTH.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test "${{ steps.ver.outputs.version }}" = "$pkg"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

      # No NODE_AUTH_TOKEN — npm uses the OIDC token from `id-token: write`
      # and publishes with provenance automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "$tag" --generate-notes --verify-tag
          else
            gh release create "$tag" --generate-notes --target "$GITHUB_SHA"
          fi
